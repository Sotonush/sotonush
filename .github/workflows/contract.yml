name: Contract

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Renew contract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 scripts/contract.py assets/contract.svg

      - name: Commit
        run: |
          git config user.name "C.C."
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contract.svg
          git diff --cached --quiet || (git commit -m "Контракт продлён" && git pull --rebase && git push)
