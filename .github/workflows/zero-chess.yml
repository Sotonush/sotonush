name: Zero Chess

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: |
          sudo apt-get install -y -qq stockfish > /dev/null
          pip install -q chess

      - name: Play
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: |
          export PATH="$PATH:/usr/games"
          python3 scripts/zero_chess.py "$ISSUE_TITLE"

      - name: Commit
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "Zero"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md chess
          git diff --cached --quiet || (git commit -m "Ход $ISSUE_AUTHOR" && git pull --rebase && git push)

      - name: Answer
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: |
          [ -s "$REPLY_FILE" ] || echo "Zero could not process this move. Try again from the README." > "$REPLY_FILE"
          printf '\n\n[Back to the board](https://github.com/%s)\n' "$OWNER" >> "$REPLY_FILE"
          gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file "$REPLY_FILE"
          gh issue close "$NUMBER" -R "$GITHUB_REPOSITORY"
