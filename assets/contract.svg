<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
<defs>
<linearGradient id="geass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff1f4b"/><stop offset="1" stop-color="#b0002a"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140a1f"/><stop offset="1" stop-color="#0b0610"/></linearGradient>
<radialGradient id="aura" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff1f4b" stop-opacity="0.35"/><stop offset="1" stop-color="#ff1f4b" stop-opacity="0"/></radialGradient>
<style>.serif{font-family:'Cormorant Garamond','Palatino Linotype','Book Antiqua',Georgia,serif}.mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.pulse{animation:pulse 3.6s ease-in-out infinite;transform-origin:760px 150px}.spin{animation:spin 50s linear infinite;transform-origin:760px 150px}@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.pulse,.spin{animation:none}}</style>
</defs>
<rect x="1" y="1" width="898" height="468" rx="14" fill="url(#paper)" stroke="#8a00ff" stroke-opacity=".55"/>
<rect x="12" y="12" width="876" height="446" rx="9" fill="none" stroke="#ff1f4b" stroke-opacity=".35" stroke-dasharray="2 6"/>
<text x="44" y="64" class="mono" font-size="13" letter-spacing="5" fill="#ff1f4b">GEASS CONTRACT · 契約</text>
<text x="44" y="104" class="serif" font-size="36" font-style="italic" fill="#e9e1f2">The power of the King</text>
<text x="44" y="140" class="serif" font-size="36" font-style="italic" fill="#e9e1f2">will make you lonely.</text>
<text x="46" y="166" class="sans" font-size="13" fill="#9a8cae">— C.C., to the one who accepted the contract</text>
