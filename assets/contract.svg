<g><text x="44" y="214" class="mono" font-size="12" fill="#ff1f4b">ART. I</text><text x="120" y="214" class="sans" font-size="15" fill="#e9e1f2">Contributions sworn this year</text><line x1="120" y1="222" x2="520" y2="222" stroke="#9a8cae" stroke-opacity=".18"/><text x="520" y="214" text-anchor="end" class="mono" font-size="16" font-weight="700" fill="#e9e1f2">963</text></g>
<g><text x="44" y="248" class="mono" font-size="12" fill="#ff1f4b">ART. II</text><text x="120" y="248" class="sans" font-size="15" fill="#e9e1f2">Cast in the shadows</text><line x1="120" y1="256" x2="520" y2="256" stroke="#9a8cae" stroke-opacity=".18"/><text x="520" y="248" text-anchor="end" class="mono" font-size="16" font-weight="700" fill="#e9e1f2">921</text></g>
<g><text x="44" y="282" class="mono" font-size="12" fill="#ff1f4b">ART. III</text><text x="120" y="282" class="sans" font-size="15" fill="#e9e1f2">Pull requests that obeyed</text><line x1="120" y1="290" x2="520" y2="290" stroke="#9a8cae" stroke-opacity=".18"/><text x="520" y="282" text-anchor="end" class="mono" font-size="16" font-weight="700" fill="#e9e1f2">0</text></g>
<g><text x="44" y="316" class="mono" font-size="12" fill="#ff1f4b">ART. IV</text><text x="120" y="316" class="sans" font-size="15" fill="#e9e1f2">Repositories under command</text><line x1="120" y1="324" x2="520" y2="324" stroke="#9a8cae" stroke-opacity=".18"/><text x="520" y="316" text-anchor="end" class="mono" font-size="16" font-weight="700" fill="#e9e1f2">10</text></g>
<g><text x="44" y="350" class="mono" font-size="12" fill="#ff1f4b">ART. V</text><text x="120" y="350" class="sans" font-size="15" fill="#e9e1f2">Longest unbroken streak</text><line x1="120" y1="358" x2="520" y2="358" stroke="#9a8cae" stroke-opacity=".18"/><text x="520" y="350" text-anchor="end" class="mono" font-size="16" font-weight="700" fill="#e9e1f2">12 days</text></g>
<g><text x="44" y="384" class="mono" font-size="12" fill="#ff1f4b">ART. VI</text><text x="120" y="384" class="sans" font-size="15" fill="#e9e1f2">Days bound by the contract</text><line x1="120" y1="392" x2="520" y2="392" stroke="#9a8cae" stroke-opacity=".18"/><text x="520" y="384" text-anchor="end" class="mono" font-size="16" font-weight="700" fill="#e9e1f2">953</text></g>
<text x="600" y="278" class="mono" font-size="12" letter-spacing="3" fill="#ff1f4b">LANGUAGES OF POWER</text>
