<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07030f"/>
      <stop offset="0.55" stop-color="#12062a"/>
      <stop offset="1" stop-color="#1d0738"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c026ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#8a00ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8a00ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sigil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#b000ff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9a8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8a00ff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .halo { animation: pulse 4s ease-in-out infinite; transform-origin: 230px 160px; }
      .ring { animation: spin 40s linear infinite; transform-origin: 230px 160px; }
      .ring2 { animation: spin 28s linear infinite reverse; transform-origin: 230px 160px; }
      .sigil { animation: flare 4s ease-in-out infinite; transform-origin: 230px 160px; }
      .scan { animation: scan 6s linear infinite; }
      .name { font: 800 76px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 14px; }
      .sub { font: 500 22px 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: #c9a6ff; }
      .tag { font: 600 15px 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: #8f7bb3; letter-spacing: 3px; }
      .line { opacity: 0; }
      .l1 { animation: show 12s infinite 0s; }
      .l2 { animation: show 12s infinite 4s; }
      .l3 { animation: show 12s infinite 8s; }
      .type rect { animation: type 4s steps(32) infinite; }
      .caret { animation: blink 1s steps(1) infinite; fill: #ff4fd8; }
      @keyframes pulse { 0%,100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes flare { 0%,100% { opacity: .9; } 50% { opacity: 1; filter: drop-shadow(0 0 10px #ff4fd8); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(360px); } }
      @keyframes show { 0%,30% { opacity: 1; } 33.3%,100% { opacity: 0; } }
      @keyframes type { 0% { width: 0; } 55%,100% { width: 560px; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#c026ff" opacity="0.25"/>

    <circle class="halo" cx="230" cy="160" r="150" fill="url(#halo)"/>
    <g class="ring" fill="none" stroke="#b000ff" stroke-opacity="0.55">
      <circle cx="230" cy="160" r="112" stroke-width="1.5" stroke-dasharray="4 10"/>
    </g>
    <g class="ring2" fill="none" stroke="#ff4fd8" stroke-opacity="0.4">
      <circle cx="230" cy="160" r="96" stroke-width="1" stroke-dasharray="60 24 6 24"/>
    </g>

    <g class="sigil" transform="translate(230 168)" fill="url(#sigil)" filter="url(#glow)">
      <path d="M0 -6 C 22 -34 62 -46 104 -34 C 74 -28 48 -14 30 6 C 50 -4 72 -6 92 0 C 62 6 34 22 12 46 C 8 30 4 12 0 -6 Z"/>
      <path d="M0 -6 C -22 -34 -62 -46 -104 -34 C -74 -28 -48 -14 -30 6 C -50 -4 -72 -6 -92 0 C -62 6 -34 22 -12 46 C -8 30 -4 12 0 -6 Z"/>
      <path d="M0 -70 C 10 -50 12 -32 0 -14 C -12 -32 -10 -50 0 -70 Z"/>
    </g>

    <text x="440" y="150" class="name" fill="url(#title)">SOTONU</text>
    <rect x="442" y="172" width="64" height="3" fill="#ff4fd8"/>

    <g class="type">
      <clipPath id="c"><rect x="440" y="186" width="0" height="40"/></clipPath>
      <g clip-path="url(#c)">
        <text x="442" y="214" class="sub line l1">&gt; Java Backend Engineer_</text>
        <text x="442" y="214" class="sub line l2">&gt; Spring Boot · PostgreSQL · Docker_</text>
        <text x="442" y="214" class="sub line l3">&gt; Code is the Geass I cast_</text>
      </g>
    </g>

    <text x="442" y="272" class="tag">KYRGYZSTAN · FULL-STACK · OPEN TO IDEAS</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#8a00ff" stroke-opacity="0.45"/>
</svg>
